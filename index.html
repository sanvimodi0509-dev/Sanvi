<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Search</title>
    <style>
        body {
            background-color: #202124;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .google-logo {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: -1px;
            color: #ffffff;
            text-align: center;
            flex-grow: 1;
        }

        .search-bar {
            background-color: #303134;
            border-radius: 30px;
            padding: 12px 20px;
            width: 90%;
            max-width: 600px;
            display: flex;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-left: 10px;
        }

        .nav-tabs {
            display: flex;
            gap: 20px;
            color: #9aa0a6;
            font-size: 14px;
            border-bottom: 1px solid #3c4043;
            width: 100%;
            justify-content: center;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .nav-tabs .active {
            color: #8ab4f8;
            border-bottom: 2px solid #8ab4f8;
            padding-bottom: 8px;
            font-weight: bold;
        }

        .content {
            text-align: center;
            max-width: 600px;
            margin-top: 10px;
        }

        .birthday-text {
            font-size: 18px;
            margin: 20px 0;
            line-height: 1.5;
        }

        .photos-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .polaroid {
            background: #ffffff;
            padding: 10px 10px 25px 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transform: rotate(-3deg);
            width: 140px;
        }

        .polaroid:nth-child(2) {
            transform: rotate(4deg);
        }

        .polaroid img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }

        .greeting {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div style="font-size: 20px;">☰</div>
        <div class="google-logo">Google</div>
        <div style="background: #ab47bc; color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold;">N</div>
    </div>

    <div class="search-bar">
        <span>🔍</span>
        <input type="text" value="Whose birthday is it?" readonly>
    </div>

    <div class="nav-tabs">
        <div>AI Mode</div>
        <div class="active">All</div>
        <div>Images</div>
        <div>News</div>
        <div>Videos</div>
    </div>

    <div class="content">
        <div class="birthday-text">
            Today, 7 December, is the birthday of the special person and <strong>it's YOU!!</strong>
        </div>

        <div class="photos-container">
            <!-- Replace 'image1.jpg' and 'image2.jpg' with your photo links or filenames -->
            <div class="polaroid">
                <img src="image1.jpg" alt="Photo 1">
            </div>
            <div class="polaroid">
                <img src="image2.jpg" alt="Photo 2">
            </div>
        </div>

        <div class="greeting">
            Happiest Birthday To A Wonderful Sir And Friend 🥰🎉🥳🎊🎂
        </div>
    </div>

</body>
</html>
